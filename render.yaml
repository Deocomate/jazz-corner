# Render Blueprint: deploy free, tự build lại mỗi lần push lên GitHub.
# Lần đầu: Render Dashboard → New → Blueprint → chọn repo này.
services:
  - type: web
    name: study-hub
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_NAME
        value: "Jazz Corner"
      - key: SESSION_SECRET
        generateValue: true
      # Turso (SQLite trên cloud, free) để dữ liệu không mất khi server ngủ.
      # Render sẽ hỏi 2 giá trị này khi tạo Blueprint.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Ho_Chi_Minh
      # Khoá DeepL API Free (dịch câu mượt hơn). Để trống thì dùng MyMemory.
      - key: DEEPL_API_KEY
        sync: false
      # Khoá Merriam-Webster Collegiate (dictionaryapi.com). Thiếu → bảng nghĩa báo "Dictionary key not set".
      - key: MW_API_KEY
        sync: false
      # [vibe:render-env]
